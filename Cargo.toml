[workspace]
members = [
    "ipc",
    "daemon",
    "cli",
    "gui",
    "telemetry_server",
    "types",
]
resolver = "2"

[workspace.package]
version = "0.5.2-beta"
authors = ["LaVashikk <contact@lavashik.dev>"]
description = "A cross-platform Rust daemon and CLI/GUI for controlling fans, TDP, battery limits, and LED on Lecoo/Emdoor laptops (IT5570/IT5571 EC)."
repository = "https://github.com/LaVashikk/Lecoo-Control-Center"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lecoo-types = { path = "types" }

# [profile.release]
# opt-level = 3
# lto = "fat"
# codegen-units = 1
# strip = "symbols"
# panic = "abort"

[release]
notes_header = """
A reverse-engineered EC daemon and CLI for Lecoo laptops on Emdoor boards: fans, power profiles, charge limits, keyboard backlight and the LED ring.

## Supported boards

| Board | Laptop | Status |
|---|---|---|
| N155A | Lecoo Pro 14 (AMD) | Full support |
| N155C | Lecoo Pro 14 (Intel i5-13420H) | Same as N155A, not confirmed on hardware |
| N155D | Lecoo Pro 14 (Intel Core Ultra 5) | No LED ring or battery info yet |
| N161A | Lecoo Air 16 | Charge control, battery info, keyboard backlight |

Your board: `cat /sys/class/dmi/id/board_name` on Linux, `(Get-CimInstance Win32_BaseBoard).Product` in PowerShell.

## Install or update

- **Windows:** extract the zip, run `install.bat` as administrator, then `lecoo-ctrl help` in a new terminal.
- **Linux:** extract the tar.gz, run `sudo ./install.sh`, then `lecoo-ctrl help`.

The installer replaces an older version, no need to uninstall first.

## Use at your own risk

This software writes directly to EC registers. A low `fan custom` duty under load can overheat the laptop, and `fan turbo` wears the fans out if left on.

[README](https://github.com/LaVashikk/Lecoo-Control-Center/blob/main/README.md) · [Русский](https://github.com/LaVashikk/Lecoo-Control-Center/blob/main/README_RU.md) · [中文](https://github.com/LaVashikk/Lecoo-Control-Center/blob/main/README_CN.md) · [Issues](https://github.com/LaVashikk/Lecoo-Control-Center/issues) · [Support the development](https://pay.cloudtips.ru/p/7e960f26)
"""

[[bundles]]
id      = "windows"
enabled = true
runner  = "windows-latest"
archive = "lecoo-{version}-windows.zip"

rust_targets = ["x86_64-pc-windows-msvc"]

setup = []

build = [
    "cargo build --release --target x86_64-pc-windows-msvc -p lecoo-ec-daemon",
    "cargo build --release --target x86_64-pc-windows-msvc -p lecoo-ctrl",
    # "cargo build --release --target x86_64-pc-windows-msvc -p lecoo-gui",
]

[[bundles.files]]
src = "target/x86_64-pc-windows-msvc/release/lecoo-ec-daemon.exe"
dst = "lecoo-ec-daemon.exe"

[[bundles.files]]
src = "target/x86_64-pc-windows-msvc/release/lecoo-ctrl.exe"
dst = "lecoo-ctrl.exe"

[[bundles.files]]
src = "libs/inpoutx64.dll"
dst = "inpoutx64.dll"

[[bundles.files]]
src = "scripts/windows/install.bat"
dst = "install.bat"

[[bundles.files]]
src = "scripts/windows/uninstall.bat"
dst = "uninstall.bat"

[[bundles.files]]
src = "LICENSE"
dst = "LICENSE"

[[bundles]]
id      = "linux-x86_64"
enabled = true
runner  = "ubuntu-latest"
archive = "lecoo-{version}-linux.tar.gz"

rust_targets = []

setup = []

build = [
    "cargo build --release -p lecoo-ec-daemon",
    "cargo build --release -p lecoo-ctrl",
]

[[bundles.files]]
src = "target/release/lecoo-ec-daemon"
dst = "lecoo-ec-daemon"

[[bundles.files]]
src = "target/release/lecoo-ctrl"
dst = "lecoo-ctrl"

[[bundles.files]]
src = "scripts/linux/install.sh"
dst = "install.sh"

[[bundles.files]]
src = "scripts/linux/uninstall.sh"
dst = "uninstall.sh"

[[bundles.files]]
src = "LICENSE"
dst = "LICENSE"
